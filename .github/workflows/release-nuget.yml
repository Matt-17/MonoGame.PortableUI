name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    environment: NuGet

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore MonoGame.PortableUI.slnx

      - name: Determine package version
        shell: pwsh
        run: |
          $match = [regex]::Match($env:GITHUB_REF_NAME, '^v(?<version>[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$')
          if (-not $match.Success) {
              throw "Release tags must use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-PRERELEASE, for example v0.2.0 or v0.2.0-alpha.2."
          }

          $version = $match.Groups['version'].Value
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Package version: $version"

      - name: Build
        shell: pwsh
        run: dotnet build MonoGame.PortableUI.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true -p:Version=$env:PACKAGE_VERSION -p:PackageVersion=$env:PACKAGE_VERSION

      - name: Test
        run: dotnet test MonoGame.PortableUI.slnx --configuration Release --no-build

      - name: Pack
        shell: pwsh
        run: |
          dotnet pack src/MonoGame.PortableUI/MonoGame.PortableUI.csproj --configuration Release --no-build --output artifacts/packages -p:Version=$env:PACKAGE_VERSION -p:PackageVersion=$env:PACKAGE_VERSION
          dotnet pack src/MonoGame.PortableUI.Effects/MonoGame.PortableUI.Effects.csproj --configuration Release --no-build --output artifacts/packages -p:Version=$env:PACKAGE_VERSION -p:PackageVersion=$env:PACKAGE_VERSION
          dotnet pack src/MonoGame.PortableUI.Themes/MonoGame.PortableUI.Themes.csproj --configuration Release --no-build --output artifacts/packages -p:Version=$env:PACKAGE_VERSION -p:PackageVersion=$env:PACKAGE_VERSION

      - name: Validate package
        shell: pwsh
        run: ./eng/validate-package.ps1 -PackageDirectory artifacts/packages -ExpectedVersion $env:PACKAGE_VERSION -ExpectedPackageIds MonoGame.PortableUI,CodeIX.PortableUI.Effects,CodeIX.PortableUI.Themes

      - name: NuGet login
        id: login
        uses: NuGet/login@v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        shell: pwsh
        run: |
          $packages = Get-ChildItem -LiteralPath artifacts/packages -Filter '*.nupkg'
          if ($packages.Count -eq 0) {
              throw "No .nupkg files found in artifacts/packages."
          }

          # No --skip-duplicate: NuGet answers "already exists" (409) also for a version that is
          # stuck in or failed validation, which made 0.3.0-alpha.2 look published while the
          # add-ons never went public. A conflict is only fine if that exact version is public.
          $failed = @()
          foreach ($package in $packages) {
              $output = dotnet nuget push $package.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json 2>&1 | Out-String
              Write-Host $output
              if ($LASTEXITCODE -eq 0) { continue }
              if ($output -match 'already exists') {
                  $id = $package.BaseName.Substring(0, $package.BaseName.Length - $env:PACKAGE_VERSION.Length - 1).ToLowerInvariant()
                  $index = "https://api.nuget.org/v3-flatcontainer/$id/index.json"
                  try { $public = (Invoke-RestMethod $index).versions -contains $env:PACKAGE_VERSION.ToLowerInvariant() } catch { $public = $false }
                  if ($public) { Write-Host "$($package.Name) is already public."; continue }
                  $failed += "$($package.Name): NuGet says it exists but it is not public (check its validation status under nuget.org > Manage packages)."
              }
              else {
                  $failed += "$($package.Name): push failed (exit $LASTEXITCODE)."
              }
          }
          if ($failed.Count -gt 0) { throw ($failed -join [Environment]::NewLine) }

      - name: Verify public packages
        shell: pwsh
        run: |
          # Pushed is not published: wait until every package of the release can be restored.
          $ids = 'monogame.portableui', 'codeix.portableui.themes'
          $version = $env:PACKAGE_VERSION.ToLowerInvariant()
          $deadline = (Get-Date).AddMinutes(30)
          do {
              $missing = @($ids | Where-Object {
                  try { -not ((Invoke-RestMethod "https://api.nuget.org/v3-flatcontainer/$_/index.json").versions -contains $version) } catch { $true }
              })
              if ($missing.Count -eq 0) { Write-Host "All packages are public."; break }
              Write-Host "Waiting for: $($missing -join ', ')"
              Start-Sleep -Seconds 60
          } while ((Get-Date) -lt $deadline)
          if ($missing.Count -gt 0) { throw "Not public after 30 minutes: $($missing -join ', ') $version" }
